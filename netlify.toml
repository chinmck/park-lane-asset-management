[build]
  publish = "."

[context.production]
  environment = { NODE_VERSION = "18" }

# The enquiry form is registered from __forms/hidden-form.html.
# Do not publish that address as a page people should open.
[[redirects]]
  from = "/__forms/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
