<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Introduction form registration</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!--
    Netlify registers the "introduction" form from this static copy.
    The same fields and options are on every page. Keep them identical.
    This page is not part of the public site.
  -->
  <form name="introduction" method="POST" action="/" data-netlify="true" netlify-honeypot="website" hidden>
    <input type="hidden" name="form-name" value="introduction">
    <input type="hidden" name="subject" value="Request an Introduction">
    <input type="hidden" name="Submitted" value="">
    <p>
      <label>Leave this field empty <input name="website" tabindex="-1" autocomplete="off"></label>
    </p>
    <input name="Full Name" type="text">
    <input name="Company / Organisation" type="text">
    <input name="Email" type="email">
    <input name="Telephone" type="tel">
    <select name="Nature of Enquiry">
      <option>Property Sale or Acquisition</option>
      <option>Partnership / Joint Venture</option>
      <option>Lender or Finance Partner</option>
      <option>Professional Introduction</option>
      <option>Other</option>
    </select>
    <input name="Introduced / Referred By" type="text">
    <textarea name="Brief Details"></textarea>
  </form>
</body>
</html>
